name: 24/7 Second Brain Pipeline

on:
  schedule:
    - cron: '0 * * * *'  # Runs hourly
  workflow_dispatch:

jobs:
  second-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OmniRoute & Claude Code CLI
        run: |
          npm install -g omniroute @anthropic-ai/claude-code

      - name: 1. Start OmniRoute Gateway (Secretary Proxy)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ~/.omniroute

          # Write OpenRouter key into OmniRoute's environment file
          echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" > ~/.omniroute/.env

          # Start OmniRoute proxy daemon
          omniroute serve --daemon &
          sleep 5

      - name: 2. Run Claude Code CLI via OmniRoute
        env:
          OPENAI_BASE_URL: "http://127.0.0.1:20128/v1"
          OPENAI_API_KEY: "omniroute-local"  # Local proxy authorization header
        run: |
          claude -p "Inspect inbox/*.txt items. Analyze taxonomy rules in CLAUDE.md. Formulate and apply file-sorting directives directly." --allowedTools "Read,Edit,Bash"
