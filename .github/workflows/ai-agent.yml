name: 24/7 Second Brain Sub-Agent

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */12 * * *'
  push:
    branches: [ main ]
    paths:
      - 'inbox/'
      - 'content/'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-sub-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Vault
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Wake Up Render Server
        run: curl -s ${{ secrets.RENDER_SERVER_URL }} || true

      - name: Process Vault via Multi-Model Sub-Agents
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.RENDER_SERVER_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
          ANTHROPIC_API_KEY: ""
        run: |
          mkdir -p inbox
          claude --model claude-3-5-sonnet --dangerously-skip-permissions -p "Read only files inside inbox/*.md. Process and append content directly into corresponding files: cs-tech.md, science-ai.md, finance-budget.md, and agriculture-iot.md. Delete processed files from inbox/."
          
      - name: Commit and Push Changes Back to Vault
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git pull --rebase --autostash origin main
            git commit -m "Automated sub-agent processing [skip ci]"
            git push origin main
          fi
